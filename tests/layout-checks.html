<!doctype html><meta charset="utf-8"><title>Office layout live DOM checks</title>
<style>body{font:14px system-ui;margin:20px}iframe{width:100%;height:900px;border:1px solid #aaa}pre{white-space:pre-wrap}</style>
<h1>Live React DOM checks</h1><p>Real React / Canvas2D / compiled Tailwind, with SDK fixtures. Not Electron or backend/polling integration. The iframe renders shipped OfficePage code. Resize the window to inspect responsiveness.</p>
<p><button id="show">Show all profiles</button> <button id="hide">Hide offline</button> <a href="index.html">Open full UI</a></p><pre id="result">Running…</pre><iframe src="index.html"></iframe>
<script>
const frame=document.querySelector('iframe');frame.onload=async()=>{const w=frame.contentWindow,d=w.document,a=w.__layout,results=[];const wait=()=>new Promise(r=>setTimeout(r,80));const assert=(v,m)=>{if(!v)throw Error(m);results.push(m)};try{for(const [name,data] of [['mixed',a.demo],['online',a.demo.map(e=>({...e,online:true}))],['offline',a.demo.map(e=>({...e,online:false,busy:false}))],['empty',[]]]){const global=a.profileOverview(data);for(const hide of [false,true]){a.set(data,hide);await wait();assert(d.querySelectorAll('[data-office-overview]').length===1,name+'/'+hide+' one global overview');for(const key of Object.keys(global))assert(Number(d.querySelector('[data-count="'+key+'"]').textContent)===global[key],name+'/'+hide+' '+key+' unaffected by filter');assert(global.total===global.working+global.idle+global.offline,name+'/'+hide+' exclusive partition');assert(d.querySelectorAll('[data-profile-row]').length===(hide?data.filter(e=>e.online).length:data.length),name+'/'+hide+' list scope')}}a.set(a.demo);await wait();d.querySelector('[data-profile-row="offline"]').click();await wait();a.hide(true);await wait();assert(d.querySelector('aside').textContent.includes('Details remain selected'),'hidden selection retained');assert(d.querySelector('[data-office-page]').scrollWidth<=d.querySelector('[data-office-page]').clientWidth+1,'no horizontal page overflow at current width');a.hide(false);window.__results={ok:true,checks:results.length,results};document.querySelector('#result').textContent=JSON.stringify(window.__results,null,2)}catch(e){window.__results={ok:false,error:String(e),results};document.querySelector('#result').textContent=JSON.stringify(window.__results,null,2)}document.querySelector('#show').onclick=()=>a.hide(false);document.querySelector('#hide').onclick=()=>a.hide(true)};
</script>
